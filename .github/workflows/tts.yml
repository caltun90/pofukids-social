# Generates voice-over with the Gemini API (the workspace cannot reach Google).
# Push tts/<job>.json to the tts-drop branch; the result lands back on the same branch.
# Needs the repo secret GEMINI_API_KEY.
name: tts
on:
  push:
    branches: [tts-drop]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet google-auth requests
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GOOGLE_TTS_SA: ${{ secrets.GOOGLE_TTS_SA }}
        run: python3 tts_run.py
      - name: Save
        run: |
          git config user.name "engrow-bot"
          git config user.email "engrow-bot@users.noreply.github.com"
          git add tts
          git diff --cached --quiet && exit 0
          git commit -m "tts sonucu"
          git push
